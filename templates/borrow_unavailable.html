{% extends 'base.html' %}

{% block content %}
<div class="center-wrap">
    <div class="confirm-box">
        <h1>Not Available</h1>
        <div class="name">{{ vehicle.car_name }}</div>

        {% if reason == 'overdue' %}
            <p style="font-size: 1.1rem; color: #ef4444; margin-bottom: 2rem;">
                ⚠️ This car is overdue. Please contact the admin.
            </p>
        {% elif reason == 'out' %}
            <p style="font-size: 1.1rem; color: #f59e0b; margin-bottom: 2rem;">
                🚗 This car is currently out.
            </p>
        {% endif %}

        <div class="confirm-actions">
            <a href="{% url 'borrow_list' %}" class="btn-no">Back to cars</a>
        </div>
    </div>
</div>
{% endblock %}
