{% extends 'base.html' %}

{% block content %}
<a href="{% url 'home' %}" class="back-link">← Back</a>
<h1>Choose a Car</h1>

<div class="tile-grid">
    {% for vehicle in vehicles %}
        <a href="{% url 'borrow_car' vehicle.id %}" class="tile">
            <span class="icon">🚙</span>
            {{ vehicle.car_name }}
        </a>
    {% empty %}
        <p class="empty-msg">No cars available right now.</p>
    {% endfor %}
</div>
{% endblock %}
