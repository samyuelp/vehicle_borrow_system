{% extends 'base.html' %}

{% block content %}
<div class="center-wrap">
    <div class="confirm-box">
        <h1>Is this you?</h1>
        <div class="name">{{ reservation.borrowers_name }}</div>

        <p class="reserve-dates">
            Reserved for <strong style="color: #a78bfa;">{{ reservation.vehicle.car_name }}</strong><br>
            {{ reservation.start_date|date:"M j" }} → {{ reservation.end_date|date:"M j" }}
        </p>

        <form method="post" class="pickup-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Confirm Pickup</button>
        </form>

        <div class="confirm-actions">
            <a href="{% url 'borrow_list' %}" class="btn-no">Not me, go back</a>
        </div>
    </div>
</div>
{% endblock %}
