<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Borrow Kiosk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #134e4a 100%);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            text-align: center;
            color: #f8fafc;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }

        /* ---- Tiles ---- */
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            justify-content: center;
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 170px;
            padding: 1.75rem;
            background: linear-gradient(160deg, rgba(51, 65, 85, 0.85) 0%, rgba(30, 41, 59, 0.85) 100%);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: #f1f5f9;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .tile::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #60a5fa;
        }

        .tile:hover {
            transform: translateY(-4px);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 16px 40px rgba(59, 130, 246, 0.25);
        }

        .tile:active {
            transform: translateY(-1px) scale(0.98);
        }

        .tile .icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
        }

        .tile .status {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .tile .status.available { color: #34d399; }
        .tile .status.out { color: #f59e0b; }
        .tile .status.reserved { color: #a78bfa; }
        .tile .status.overdue { color: #ef4444; }

        .tile-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---- Home screen ---- */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            margin-top: 3rem;
        }

        .home-tile {
            min-height: 360px;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .home-tile.borrow {
            background: linear-gradient(160deg, #1e3a8a 0%, #1e40af 50%, #172554 100%);
            border: 1px solid rgba(96, 165, 250, 0.35);
        }
        .home-tile.borrow::before {
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
        }
        .home-tile.borrow:hover {
            box-shadow: 0 20px 48px rgba(59, 130, 246, 0.4);
        }

        .home-tile.return {
            background: linear-gradient(160deg, #065f46 0%, #047857 50%, #064e3b 100%);
            border: 1px solid rgba(52, 211, 153, 0.35);
        }
        .home-tile.return::before {
            background: linear-gradient(90deg, #34d399, #10b981);
        }
        .home-tile.return:hover {
            box-shadow: 0 20px 48px rgba(16, 185, 129, 0.4);
        }

        .home-tile.reserve {
            background: linear-gradient(160deg, #7c3aed 0%, #6d28d9 50%, #4c1d95 100%);
            border: 1px solid rgba(167, 139, 250, 0.35);
        }
        .home-tile.reserve::before {
            background: linear-gradient(90deg, #a78bfa, #8b5cf6);
        }
        .home-tile.reserve:hover {
            box-shadow: 0 20px 48px rgba(124, 58, 237, 0.4);
        }

        .home-tile .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
        }

        /* ---- Forms ---- */
        form {
            max-width: 560px;
            margin: 0 auto;
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
        }

        form p {
            margin-bottom: 1.5rem;
        }

        form label {
            display: block;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 1.1rem 1.25rem;
            font-size: 1.2rem;
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.7);
            color: #f1f5f9;
            font-family: inherit;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        form input::placeholder,
        form textarea::placeholder {
            color: #64748b;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
        }

        form button {
            width: 100%;
            padding: 1.35rem;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45);
            transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
            letter-spacing: 0.01em;
        }

        form button:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            box-shadow: 0 10px 26px rgba(59, 130, 246, 0.55);
        }

        form button:active {
            transform: scale(0.98);
        }

        /* ---- Confirm screen ---- */
        .center-wrap {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirm-box {
            max-width: 640px;
            width: 100%;
            margin: 4rem auto;
            text-align: center;
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            padding: 3.5rem 3rem;
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .confirm-box h1 {
            font-size: 2rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .confirm-box .name {
            font-size: 3rem;
            font-weight: 800;
            margin: 1.5rem 0;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .confirm-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .confirm-actions a {
            flex: 1;
            padding: 1.35rem;
            font-size: 1.3rem;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
        }

        .confirm-actions a:active {
            transform: scale(0.98);
        }

        .btn-yes {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
        }

        .btn-yes:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 10px 26px rgba(16, 185, 129, 0.55);
        }

        .btn-no {
            background: rgba(100, 116, 139, 0.25);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .btn-no:hover {
            background: rgba(100, 116, 139, 0.4);
        }

        /* ---- Reserve success extras ---- */
        .reserve-dates {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .code-label {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .pickup-form {
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    margin-top: 2rem;
    max-width: 100%;
    backdrop-filter: none;
}

        .pickup-code {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .code-warning {
            font-size: 1rem;
            color: #f59e0b;
            font-weight: 600;
        }

        /* ---- Misc ---- */
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #94a3b8;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: background 0.15s, color 0.15s;
        }

        .back-link:hover {
            background: rgba(148, 163, 184, 0.15);
            color: #f1f5f9;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.3rem;
            color: #64748b;
            padding: 3rem 0;
        }
    </style>
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
